name: stockcast

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  environment: &backend-env
    DATABASE_URL: postgresql://stockcast:${APP_DB_PASSWORD:?Run npm start or configure .env}@database:5432/stockcast
    APP_ENV: ${APP_ENV:-development}
    CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
    ARTIFACT_DIR: /app/data/models
    OWNER_BUSINESS_ID: ${OWNER_BUSINESS_ID:-00000000-0000-4000-8000-000000000001}
    OWNER_BUSINESS_NAME: ${OWNER_BUSINESS_NAME:-StockCast Store}
    OWNER_DISPLAY_NAME: ${OWNER_DISPLAY_NAME:-Store Owner}
    OWNER_EMAIL: ${OWNER_EMAIL:-owner@example.com}
    OWNER_DATA_ORIGIN: ${OWNER_DATA_ORIGIN:-demo}
    OWNER_PASSWORD: ${OWNER_PASSWORD:?Run npm start or configure .env}

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stockcast
      POSTGRES_USER: stockcast_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm start or configure .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Run npm start or configure .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/init-database.sh:/docker-entrypoint-initdb.d/10-stockcast.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U stockcast_admin -d stockcast"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  initialize:
    <<: *backend
    command: [python, -m, backend.app.initialize]
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    environment:
      <<: *backend-env
      # The API port is private; Caddy supplies the authenticated client address.
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - model_data:/app/data/models
    depends_on:
      initialize:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3001/api/v1/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  worker:
    <<: *backend
    command: [python, -m, backend.app.worker]
    volumes:
      - model_data:/app/data/models
    depends_on:
      initialize:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build: .
    environment:
      APP_ADDRESS: ${APP_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  model_data:
  caddy_data:
  caddy_config:
